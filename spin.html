<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spin The Bottle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #d18ee4, #feb47b);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;

        }


        #wheel {
            background: white;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
            width: 90%;
            max-width: 400px;
        }

        #bottle {
            position: absolute;
            width: 100px;
            height: auto;
            top: 10%;
        }

        
        #selectedName {
            color: #ff5e62;
            font-size: 52px;
            margin-bottom: 10px;
        }

       

       

        #actionButtons {
            background: white;
            padding: 100px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .primary-button {
            background: linear-gradient(to right, #0072ff, #00c6ff);
            border: none;
            color: white;
            padding: 40px;
            margin: 15px 0;
            width: 100%;
            font-size: 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .primary-button:hover {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            transform: scale(1.05);
        }

        .backButton {
            font-size: 35px;
            top: 50px;
            left: 20px;
            padding: 30px 60px;
            border-radius: 10px;
        }
       
        #gifimg{
            width:600px;height: 500px;

        }
       



.action-button {
    font-size: 40px;
    padding: 26px 52px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}


@media (min-width: 960px) {
            #bottle {
                width: 150px;
                height: 400px;
                top: 55%;
                left: 50%
            }

            #wheel {
                max-width: 700px;
            }

            #selectedName {
                font-size: 66px;
            }

            #randomQuestion {
                font-size: 36px;
                color: white;
            }
            #gifimg{
                width:600px;height: 500px;
            }
            #actionButton {
                padding: 20px;
                gap: 80px;
            }

            .primary-button {
                font-size: 68px;
                padding: 30px 60px;
            }

            
            #timee,#timer {
                font-size: 36px;
                
            }
            #questionArea{
                margin-top: 60px;
                max-width: 700px;
            }
            #buttonContainer {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
    padding-top: 20px;
    gap: 20px;
}
#sButton,#doneButton {
    
    padding: 20px;
    font-size: 20px;
}
}
@media (max-width: 790px){
    
    
            #timee,#timer {
                font-size: 36px;
                
            }
            #timee{
                margin-top: 500px;
            }
            #questionArea{
                margin-top: 200px;
                max-width: 800px;
                height: 80vh;
                padding: 50px;
            }


#buttonContainer {
    
    padding-top: 20px;
    gap: 40px;
    
    
}
        
#sButton {
    background-color: #000;
    color: #fff;
    
}

#doneButton {
    background-color: #ff5e62;
    color: #fff;
    

}

#doneButton:hover {
    background-color: #ff4040;
    transform: scale(1.05);
}

#sButton:hover {
    background-color: #222;
    transform: scale(1.05);
}
#randomQuestion {
                color: white;
                font-size: 100px;
            }
}

#timee{
    margin-top: 400px;
}
#randomQuestion {
                color: white;
                font-size: 80px;
            }
 
#sButton,#doneButton {
    
    padding: 50px;
    font-size: 40px;
}  
#questionArea{
    max-width: 800px;
}
#changequestion{
    padding: 40px;
    font-size: 30px;
}



    </style>

</head>

<body>
    <button onclick="goBack()" class="backButton">🔙 Back</button>

    <canvas id="wheel" width="400" height="400"></canvas>

    <img id="bottle" src="./botttleee.png">

    <div id="actionButtons" style="display:none; text-align:center;">

        <h2 id="selectedName"></h2>


        <button id="truthButton" class="primary-button">Truth</button>
        <button id="dareButton" class="primary-button">Dare</button>
        <button id="bunnifyButton" class="primary-button">Bunnify</button>
    </div>
    <div id="wbutton" style="display: none;">
        <img src="" id="gifimg" alt="" >
    </div>


    <div id="questionArea" style="display:none; text-align:center;">
        <h2 id="selectedName"></h2>
        <p id="randomQuestion"></p>
        <button id="changequestion">change question</button>

        <p id="timee">Time left: <span id="timer"></span> seconds</p>
        <!-- Button container -->
    <div id="buttonContainer">
        <button id="sButton" class="action-button" style="background-color: black;">Forfeit</button>
        <button id="doneButton" class="action-button">Done</button>
    </div>

       
    </div>
    <div onclick=""></div>
    <script>
        function goBack() {
            window.location.href = "add-names.html";
        }
    </script>

    <script src="script.js"></script>
</body>

</html>
